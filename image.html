<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .image-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Rules targeting screens >= 1280px wide and >= 600px tall */
        @media screen and (min-width: 1280px) and (min-height: 600px) {
            .image-gallery {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: space-between;
                align-items: center;
            }

            .image-gallery img {
                max-width: 18%;
                height: auto;
            }
        }

        .img-card {
            border: 2px solid #ccc;
            padding: 5px;
            background: #fff;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="index.html">Home</a>
        <a href="images.html">Images</a>
        <a href="hidden.html">Hidden Text</a>
    </nav>

    <div class="content">
        <h2>Image Gallery</h2>
        <div class="image-gallery">
            <img class="img-card" src="[https://picsum.photos/id/10/300/200](https://picsum.photos/id/10/300/200)" alt="Sample 1">
            <img class="img-card" src="[https://picsum.photos/id/20/300/200](https://picsum.photos/id/20/300/200)" alt="Sample 2">
            <img class="img-card" src="[https://picsum.photos/id/30/300/200](https://picsum.photos/id/30/300/200)" alt="Sample 3">
            <img class="img-card" src="[https://picsum.photos/id/40/300/200](https://picsum.photos/id/40/300/200)" alt="Sample 4">
            <img class="img-card" src="[https://picsum.photos/id/50/300/200](https://picsum.photos/id/50/300/200)" alt="Sample 5">
        </div>
    </div>

</body>
</html>
