<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .image-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Responsive rules: When screen is >= 1280px wide and >= 600px tall */
        @media screen and (min-width: 1280px) and (min-height: 600px) {
            .image-gallery {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                justify-content: space-between;
                align-items: center;
            }

            .image-gallery img {
                max-width: 18%;
                height: auto;
            }
        }

        .img-card {
            border: 2px solid #cbd5e1;
            padding: 5px;
            background: #ffffff;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="index.html">Home</a>
        <a href="images.html">Images</a>
        <a href="hidden.html">Hidden Text</a>
    </nav>

    <div class="content">
        <h2>Image Gallery</h2>
        <div class="image-gallery">
            <img class="img-card" src="image1.jpeg" alt="Image 1">
            <img class="img-card" src="image2.jpeg" alt="Image 2">
            <img class="img-card" src="image3.jpeg" alt="Image 3">
            <img class="img-card" src="image4.jpeg" alt="Image 4">
            <img class="img-card" src="image5.jpeg" alt="Image 5">
    </div>

</body>
</html>
